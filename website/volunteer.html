<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer Sign-up · Project Graduation</title>
  <meta name="description" content="Register to volunteer for Project Graduation, then pick shifts in the volunteer portal.">
  <meta name="theme-color" content="#121114">
  <link rel="icon" href="assets/mark-maroon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="flow-page" data-flow="volunteer">

  <div class="flow-bar">
    <span data-brand></span>
    <span class="flow-count mono" data-count></span>
    <a class="flow-exit" href="get-involved.html">Exit</a>
  </div>
  <div class="flow-progress" aria-hidden="true"><i data-progress></i></div>

  <main class="flow">
    <div class="flow-stickers" aria-hidden="true">
      <div class="sticker-wrap fs-1" data-sticker="heart" style="--r:-10deg; --delay:.2s"></div>
      <div class="sticker-wrap fs-2" data-sticker="eyes" style="--r:8deg; --delay:.35s"></div>
      <div class="sticker-wrap fs-3" data-sticker="mascot" style="--r:4deg; --delay:.5s; --boil:1.5s"></div>
    </div>
    <form class="flow-stage" data-stage novalidate autocomplete="on"></form>
    <nav class="flow-nav" aria-label="Question navigation">
      <button class="circle-btn" type="button" data-back aria-label="Previous question"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 7l5 5.5"/></svg></button>
      <button class="circle-btn" type="button" data-fwd aria-label="Next question"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5 10 13l5-5.5"/></svg></button>
    </nav>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/stickers.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/flow.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
