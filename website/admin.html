<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Console · Project Graduation</title>
  <meta name="theme-color" content="#121114">
  <link rel="icon" href="assets/mark-maroon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">

  <!-- sign in -->
  <section class="login" data-login hidden>
    <form class="login-card" data-login-form>
      <div data-sticker="cap" data-still class="login-sticker"></div>
      <p class="eyebrow">// admin console</p>
      <h1>Project Graduation</h1>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <p class="login-error" role="alert" data-login-error></p>
      <button class="btn btn-maroon" type="submit">Sign in <span class="arrow">→</span></button>
      <a class="login-back" href="index.html">← back to the site</a>
    </form>
  </section>

  <!-- console -->
  <div class="console" data-console hidden>
    <aside class="side">
      <a class="brand" href="admin.html"><img src="assets/mark-white.png" alt=""><span>Project Graduation<small>Admin console</small></span></a>
      <nav class="side-nav" aria-label="Admin sections">
        <a href="#overview" data-tab="overview"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>Overview</a>
        <a href="#fundraising" data-tab="fundraising"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 15h14M5 12l3-4 3 2 4-6"/></svg>Fundraising</a>
        <a href="#events" data-tab="events"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.5" width="14" height="12" rx="2"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4"/></svg>Events</a>
        <a href="#registrations" data-tab="registrations"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h12v12H4z"/><path d="M7 8h6M7 11h6M7 14h3"/></svg>Registrations</a>
        <a href="#sponsors" data-tab="sponsors"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="8" r="4.5"/><path d="M7 12l-1.5 5.5L10 15l4.5 2.5L13 12"/></svg>Sponsors <b class="pill" data-new-count hidden></b></a>
      </nav>
      <div class="side-foot">
        <a href="index.html" target="_blank" rel="noopener">View site ↗</a>
        <button type="button" data-logout>Sign out</button>
      </div>
    </aside>
    <main class="pane" data-pane tabindex="-1"></main>
  </div>

  <dialog class="drawer" data-drawer aria-labelledby="drawer-title"></dialog>

  <script src="assets/js/stickers.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
